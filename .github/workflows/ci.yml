name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -count=1

      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1

  static:
    name: static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: cross compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            out="dist/0800_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" .
            file "$out" | grep -q "statically linked" || [ "$os" != "linux" ]
          done
          ls -lh dist

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: fuzz parsers
        run: |
          go test -run '^$' -fuzz FuzzReadTLV     -fuzztime 15s ./internal/ldap
          go test -run '^$' -fuzz FuzzXDRReader   -fuzztime 15s ./internal/nfs
          go test -run '^$' -fuzz FuzzParseType2  -fuzztime 15s ./internal/smb
          go test -run '^$' -fuzz FuzzParseDirEntries -fuzztime 15s ./internal/smb
