version: 2

project_name: 0800

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: 0800
    main: .
    binary: 0800
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/rsha/0800/compare/{{ .PreviousTag }}...{{ .Tag }}

    Only use 0800 against systems you own or have written permission to test.
